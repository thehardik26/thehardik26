name: Generate Trophies

on:
  schedule:
    - cron: "0 0 * * *"     # regenerates once a day
  workflow_dispatch: {}      # lets you trigger it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trophy image
        run: |
          mkdir -p profile
          curl -sL "https://github-profile-trophy.vercel.app/?username=thehardik26&theme=tokyonight&no-frame=false&no-bg=false&margin-w=4" -o profile/trophy.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update trophy svg"
          git push
